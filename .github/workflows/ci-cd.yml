name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas con Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage

  despliegue:
    name: Despliegue en Vercel
    needs: pruebas
    # Solo se despliega lo que llega a main y ya pasó las pruebas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Revisar secretos
        id: secretos
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$MONGODB_URI" ] || [ -z "$JWT_SECRET" ]; then
            echo "::warning::Faltan los secretos VERCEL_TOKEN, MONGODB_URI o JWT_SECRET; se omite el despliegue."
            echo "listos=false" >> "$GITHUB_OUTPUT"
          else
            echo "listos=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar a producción
        id: despliegue
        if: steps.secretos.outputs.listos == 'true'
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env MONGOMS_DISABLE_POSTINSTALL=1 \
            --env MONGODB_URI="$MONGODB_URI" \
            --env JWT_SECRET="$JWT_SECRET")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Prueba de humo
        if: steps.secretos.outputs.listos == 'true'
        env:
          URL: ${{ steps.despliegue.outputs.url }}
        run: |
          # La API debe responder y las rutas de productos deben exigir token
          curl --fail --silent --show-error --retry 3 "$URL/api/salud"
          codigo=$(curl --silent --output /dev/null --write-out "%{http_code}" "$URL/api/productos")
          test "$codigo" = "401"
